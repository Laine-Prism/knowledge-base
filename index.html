 ← 第 1 层：接口层\n│   │   │   ├── __init__.py\n│   │   │   ├── deps.py                   # 依赖注入\n│   │   │   ├── v1/\n│   │   │   │   ├── crawl.py             # 采集相关路由\n│   │   │   │   ├── contents.py          # 内容管理路由\n│   │   │   │   ├── tasks.py             # 定时任务路由\n│   │   │   │   └── notifications.py     # 通知路由\n│   │   │   └── schemas/                  # 请求/响应模型\n│   │   │       ├── crawl.py\n│   │   │       ├── content.py\n│   │   │       └── task.py\n│   │   │\n│   │   ├── application/                  ← 第 2 层：应用层（用例）\n│   │   │   ├── __init__.py\n│   │   │   ├── crawl_article.py          # 用例：采集文章\n│   │   │   ├── download_video.py         # 用例：下载视频\n│   │   │   ├── transcribe_video.py       # 用例：转录视频\n│   │   │   ├── search_content.py         # 用例：搜索热门内容\n│   │   │   ├── export_content.py         # 用例：导出内容\n│   │   │   └── schedule_task.py          # 用例：管理定时任务\n│   │   │\n│   │   ├── domain/                       ← 第 3 层：领域层（核心）\n│   │   │   ├── __init__.py\n│   │   │   ├── entities/                 # 实体\n│   │   │   │   ├── content.py            # Content 实体\n│   │   │   │   ├── task.py               # ScheduledTask 实体\n│   │   │   │   └── notification.py       # Notification 实体\n│   │   │   ├── value_objects/            # 值对象\n│   │   │   │   ├── platform.py           # Platform 枚举\n│   │   │   │   ├── hot_score.py          # 热度评分\n│   │   │   │   └── transcript.py         # 转录结果\n│   │   │   ├── services/                 # 领域服务（纯业务规则）\n│   │   │   │   ├── scoring.py            # 热度排序算法\n│   │   │   │   └── fallback.py           # 引擎降级策略\n│   │   │   └── ports/                    # 端口定义（接口契约）\n│   │   │       ├── browser_port.py       # 浏览器引擎接口\n│   │   │       ├── crawler_port.py       # 爬虫接口\n│   │   │       ├── downloader_port.py    # 下载器接口\n│   │   │       ├── transcriber_port.py   # ASR 接口\n│   │   │       ├── repository_port.py    # 数据存储接口\n│   │   │       ├── notifier_port.py      # 通知接口\n│   │   │       └── exporter_port.py      # 导出接口\n│   │   │\n│   │   ├── infrastructure/               ← 第 4 层：基础设施层（实现）\n│   │   │   ├── __init__.py\n│   │   │   ├── browser/                  # 浏览器引擎实现\n│   │   │   │   ├── drission_adapter.py   # L1: DrissionPage\n│   │   │   │   ├── playwright_adapter.py # L2: Playwright\n│   │   │   │   ├── browseruse_adapter.py # L3: browser-use\n│   │   │   │   └── smart_browser.py      # 智能降级适配器\n│   │   │   ├── crawlers/                 # 各平台爬虫实现\n│   │   │   │   ├── wechat_crawler.py\n│   │   │   │   ├── toutiao_crawler.py\n│   │   │   │   ├── douyin_crawler.py\n│   │   │   │   └── wechat_video_crawler.py\n│   │   │   ├── downloaders/              # 视频下载实现\n│   │   │   │   ├── douyin_downloader.py\n│   │   │   │   ├── wechat_video_downloader.py\n│   │   │   │   └── ytdlp_downloader.py\n│   │   │   ├── transcribers/             # ASR 实现\n│   │   │   │   ├── sensevoice_adapter.py\n│   │   │   │   └── whisper_adapter.py    # 备选\n│   │   │   ├── persistence/              # 数据库实现\n│   │   │   │   ├── database.py           # 连接管理\n│   │   │   │   ├── models.py             # ORM 模型\n│   │   │   │   └── repositories/\n│   │   │   │       ├── content_repo.py\n│   │   │   │       ├── task_repo.py\n│   │   │   │       └── notification_repo.py\n│   │   │   ├── notifiers/                # 通知实现\n│   │   │   │   ├── in_app_notifier.py\n│   │   │   │   ├── wechat_notifier.py    # 后续\n│   │   │   │   └── feishu_notifier.py    # 后续\n│   │   │   ├── exporters/                # 导出实现\n│   │   │   │   ├── markdown_exporter.py\n│   │   │   │   ├── word_exporter.py\n│   │   │   │   └── pdf_exporter.py\n│   │   │   └── tasks/                    # Celery 异步任务\n│   │   │       ├── celery_app.py\n│   │   │       ├── crawl_tasks.py\n│   │   │       └── transcribe_tasks.py\n│   │   │\n│   │   ├── main.py                       # FastAPI 入口\n│   │   ├── config.py                     # 配置管理\n│   │   └── container.py                  # 依赖注入容器\n│   │\n│   ├── alembic/                          # 数据库迁移\n│   ├── tests/\n│   │   ├── unit/                         # 单元测试（测领域层）\n│   │   ├── integration/                  # 集成测试（测基础设施层）\n│   │   └── e2e/                          # 端到端测试\n│   ├── requirements.txt\n│   └── Dockerfile\n│\n├── frontend/                             # 前端（独立关注）\n│   ├── src/\n│   │   ├── views/\n│   │   ├── components/\n│   │   ├── composables/                  # Vue 3 组合式函数\n│   │   ├── api/\n│   │   ├── stores/\n│   │   └── types/\n│   ├── package.json\n│   └── Dockerfile\n│\n└── config/\n    ├── browser_engines.yaml\n    ├── platforms.yaml\n    └── notifications.yaml\n```\n\n---\n\n## 六、关键代码示例（展示各层如何协作）\n\n### 第 3 层：领域层 — 定义接口（Port）\n\n```python\n# domain/ports/crawler_port.py\nfrom abc import ABC, abstractmethod\nfrom domain.entities.content import Content\n\nclass CrawlerPort(ABC):\n    \"\"\"爬虫接口契约 — 所有平台爬虫必须实现这个\"\"\"\n    \n    @abstractmethod\n    async def fetch_article(self, url: str) -> Content:\n        \"\"\"抓取文章，返回统一的 Content 实体\"\"\"\n        pass\n    \n    @abstractmethod\n    async def search(self, keyword: str, limit: int = 20) -> list[Content]:\n        \"\"\"搜索内容\"\"\"\n        pass\n```\n\n```python\n# domain/ports/transcriber_port.py\nfrom abc import ABC, abstractmethod\nfrom domain.value_objects.transcript import TranscriptResult\n\nclass TranscriberPort(ABC):\n    \"\"\"ASR 接口契约 — 不管用 SenseVoice 还是 Whisper\"\"\"\n    \n    @abstractmethod\n    async def transcribe(self, audio_path: str) -> TranscriptResult:\n        pass\n```\n\n### 第 4 层：基础设施层 — 实现接口\n\n```python\n# infrastructure/crawlers/wechat_crawler.py\nfrom domain.ports.crawler_port import CrawlerPort\nfrom domain.entities.content import Content\n\nclass WechatArticleCrawler(CrawlerPort):\n    \"\"\"微信公众号爬虫 — 实现 CrawlerPort 接口\"\"\"\n    \n    def __init__(self, browser: SmartBrowser):\n        self.browser = browser\n    \n    async def fetch_article(self, url: str) -> Content:\n        # 具体实现：用 DrissionPage/Playwright 抓取\n        html = await self.browser.fetch(url, platform=\"wechat\")\n        return Content(\n            title=self._extract_title(html),\n            body=self._extract_body(html),\n            platform=\"wechat\",\n            ...\n        )\n```\n\n### 第 2 层：应用层 — 编排用例\n\n```python\n# application/crawl_article.py\nfrom domain.ports.crawler_port import CrawlerPort\nfrom domain.ports.repository_port import ContentRepository\n\nclass CrawlArticleUseCase:\n    \"\"\"用例：采集一篇文章\"\"\"\n    \n    def __init__(self, crawler: CrawlerPort, repo: ContentRepository):\n        self.crawler = crawler      # 不知道具体是哪个爬虫\n        self.repo = repo            # 不知道具体是什么数据库\n    \n    async def execute(self, url: str) -> Content:\n        # 1. 抓取\n        content = await self.crawler.fetch_article(url)\n        # 2. 保存\n        await self.repo.save(content)\n        # 3. 返回\n        return content\n```\n\n### 第 1 层：接口层 — 处理 HTTP\n\n```python\n# api/v1/crawl.py\nfrom fastapi import APIRouter, Depends\nfrom api.deps import get_crawl_use_case\nfrom api.schemas.crawl import CrawlRequest, CrawlResponse\n\nrouter = APIRouter()\n\n@router.post(\"/crawl/url\")\nasync def crawl_by_url(\n    request: CrawlRequest,\n    use_case = Depends(get_crawl_use_case)  # 依赖注入\n):\n    content = await use_case.execute(request.url)\n    return CrawlResponse.from_entity(content)\n```\n\n### 依赖注入容器 — 把各层组装起来\n\n```python\n# container.py\nfrom infrastructure.browser.smart_browser import SmartBrowser\nfrom infrastructure.crawlers.wechat_crawler import WechatArticleCrawler\nfrom infrastructure.crawlers.toutiao_crawler import ToutiaoCrawler\nfrom infrastructure.persistence.repositories.content_repo import PostgresContentRepo\nfrom application.crawl_article import CrawlArticleUseCase\n\nclass Container:\n    \"\"\"依赖注入容器 — 在这里决定用哪个具体实现\"\"\"\n    \n    def __init__(self, config):\n        # 基础设施\n        self.browser = SmartBrowser(config.browser)\n        self.content_repo = PostgresContentRepo(config.database)\n        \n        # 爬虫（可以随时换实现）\n        self.crawlers = {\n            \"wechat\": WechatArticleCrawler(self.browser),\n            \"toutiao\": ToutiaoCrawler(self.browser),\n        }\n    \n    def get_crawl_use_case(self, platform: str) -> CrawlArticleUseCase:\n        return CrawlArticleUseCase(\n            crawler=self.crawlers[platform],\n            repo=self.content_repo\n        )\n```\n\n---\n\n## 七、防屎山规则清单\n\n| # | 规则 | 怎么检查 |\n|---|------|---------|\n| 1 | **领域层零依赖** | `domain/` 下的文件不能 import fastapi、sqlalchemy、playwright 等 |\n| 2 | **一个文件一个职责** | 每个文件不超过 200 行 |\n| 3 | **接口先行** | 先写 Port（接口），再写 Adapter（实现） |\n| 4 | **用例单一** | 每个 Use Case 只做一件事 |\n| 5 | **不允许跨层调用** | API 层不能直接调基础设施层 |\n| 6 | **配置外置** | 所有可变配置放 yaml/env，不硬编码 |\n| 7 | **命名统一** | Port 结尾用 `_port`，Adapter 结尾用 `_adapter` |\n| 8 | **测试跟随** | 每个 Use Case 必须有对应的单元测试 |\n\n---\n\n## 八、这套架构解决了什么问题？\n\n| 问题 | 屎山写法 | 整洁架构写法 |\n|------|---------|------------|\n| 抖音接口挂了 | 到处改代码，牵一发动全身 | 只改 `infrastructure/crawlers/douyin_crawler.py` |\n| 想换 ASR 引擎 | 全局搜索替换，漏一个就报错 | 新写一个 adapter，改一行注入配置 |\n| 加一个新平台 | 复制粘贴大量重复代码 | 实现 CrawlerPort 接口，注册到容器 |\n| 想加飞书通知 | 在业务代码里到处加 if-else | 新写 FeishuNotifier，配置文件开启 |\n| 写单元测试 | 没法测，因为到处耦合数据库和网络 | 领域层纯逻辑，mock 接口即可测试 |\n\n---\n\n## 九、确认问题\n\n请你确认以下几点：\n\n1. **四层架构**（接口层 → 应用层 → 领域层 ← 基础设施层）你认可吗？\n2. **依赖注入**的方式你能接受吗？（代码稍微多一点，但换来可维护性）\n3. **目录结构**你觉得清晰吗？有想调整的吗？\n4. **防屎山规则**有没有你想加的？", "word_count": 13126}];
let currentView = 'list';

// ========== CRUD 操作 ==========
let editingPath = null;

function showArticleEditor(existing) {
  editingPath = existing ? existing.path : null;
  const cats = [...new Set(DATA.map(a => a.category))];
  let h = '<div class="modal-overlay" onclick="event.target===this&&closeEditor()"><div class="modal">';
  h += `<h2>${existing ? '✏️ 编辑文章' : '➕ 新增文章'}</h2>`;
  h += '<label>标题</label><input id="ae-title" value="' + escHtml(existing ? existing.title : '') + '">';
  h += '<label>分类</label><div style="display:flex;gap:6px">';
  h += '<input id="ae-category" list="cat-list" value="' + escHtml(existing ? existing.category : '') + '" style="flex:1">';
  h += '<datalist id="cat-list">' + cats.map(c => '<option value="' + escHtml(c) + '">').join('') + '</datalist>';
  h += '</div>';
  h += '<label>日期</label><input id="ae-date" type="date" value="' + escHtml(existing ? existing.date : '') + '">';
  h += '<label>来源</label><input id="ae-source" value="' + escHtml(existing ? existing.source || '' : '') + '">';
  h += '<label>摘要 (300-500字)</label><textarea id="ae-summary" rows="5">' + escHtml(existing ? existing.summary || '' : '') + '</textarea>';
  h += '<label>正文 (Markdown)</label><textarea id="ae-content" rows="12">' + escHtml(existing ? existing.content || '' : '') + '</textarea>';
  h += '<div id="ae-status"></div>';
  h += '<div class="modal-btns">';
  h += '<button class="btn-secondary" onclick="closeEditor()">取消</button>';
  h += '<button class="btn-primary" onclick="saveArticle()">' + (existing ? '保存修改' : '创建文章') + '</button>';
  h += '</div></div></div>';
  const overlay = document.createElement('div');
  overlay.innerHTML = h;
  document.body.appendChild(overlay.firstElementChild);
}

function closeEditor() {
  editingPath = null;
  const overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
}

async function saveArticle() {
  const title = document.getElementById('ae-title').value.trim();
  const category = document.getElementById('ae-category').value.trim();
  const date = document.getElementById('ae-date').value.trim();
  const source = document.getElementById('ae-source').value.trim();
  const summary = document.getElementById('ae-summary').value.trim();
  const content = document.getElementById('ae-content').value.trim();

  if (!title) { showStatus('请填写标题', 'error'); return; }
  if (!category) { showStatus('请填写分类', 'error'); return; }

  const payload = { title, category, date, source, summary, content, path: editingPath || undefined };

  try {
    if (API_BASE) {
      // 本地 API 模式
      const method = editingPath ? 'PUT' : 'POST';
      const resp = await fetch(API_BASE + '/article', {
        method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
      });
      const result = await resp.json();
      if (result.error) { showStatus(result.error, 'error'); return; }
      showStatus(result.message, 'success');
      // 延迟刷新
      setTimeout(() => location.reload(), 800);
    } else {
      // 静态模式 - localStorage
      let changes = getLocalChanges();
      const newId = editingPath || ('new_' + Date.now());
      changes.edits[newId] = {
        ...payload,
        path: newId,
        summary_method: 'manual',
        word_count: content.length,
      };
      if (editingPath) changes.edits[editingPath] = changes.edits[newId];
      saveLocalChanges(changes);
      showStatus('已保存到本地（静态部署模式）', 'success');
      setTimeout(() => {
        mergeLocalChanges();
        closeEditor();
        if (currentView === 'detail') openArticle(newId);
        else renderList();
      }, 500);
    }
  } catch(e) {
    showStatus('保存失败: ' + e.message, 'error');
  }
}

async function deleteArticle(path) {
  if (!confirm('确定删除这篇文章？此操作不可撤销。')) return;

  try {
    if (API_BASE) {
      const resp = await fetch(API_BASE + '/article', {
        method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path})
      });
      const result = await resp.json();
      if (result.error) { alert(result.error); return; }
      location.reload();
    } else {
      let changes = getLocalChanges();
      changes.deleted.push(path);
      saveLocalChanges(changes);
      mergeLocalChanges();
      goBack();
    }
  } catch(e) {
    alert('删除失败: ' + e.message);
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('ae-status');
  if (el) el.innerHTML = '<div class="status-msg ' + type + '">' + escHtml(msg) + '</div>';
}

function mergeLocalChanges() {
  const changes = getLocalChanges();
  const deleted = new Set(changes.deleted);
  // 从 DATA 移除已删除的
  for (let i = DATA.length - 1; i >= 0; i--) {
    if (deleted.has(DATA[i].path)) DATA.splice(i, 1);
  }
  // 合并编辑
  for (const [id, edit] of Object.entries(changes.edits)) {
    const idx = DATA.findIndex(a => a.path === id);
    if (idx >= 0) {
      DATA[idx] = { ...DATA[idx], ...edit };
    } else {
      DATA.push(edit);
    }
  }
}

// 初始化时合并 localStorage
mergeLocalChanges();


// API 配置：本地运行时会自动检测 kb_server
const API_BASE = (() => {
  try { return window.location.port === '8765' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? '/api' : null; }
  catch(e) { return null; }
})();
// localStorage 键名
const LS_KEY = 'kb_local_changes';
function getLocalChanges() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{"edits":{},"deleted":[]}'); } catch(e) { return {"edits":{},"deleted":[]}; } }
function saveLocalChanges(changes) { localStorage.setItem(LS_KEY, JSON.stringify(changes)); }


function init() {
  renderSidebar();
  renderList();
}
function getCategories() {
  const cats = {};
  DATA.forEach(a => {
    if (!cats[a.category]) cats[a.category] = [];
    cats[a.category].push(a);
  });
  return Object.entries(cats).sort((a,b) => a[0].localeCompare(b[0]));
}
function renderSidebar() {
  const el = document.getElementById('categoryList');
  const cats = getCategories();
  const total = DATA.length;
  let h = `<a class="link ${!selectedCategory ? 'active' : ''}" onclick="showAll()">📋 全部文章 (${total})</a>`;
  h += `<button class="btn-primary" style="margin:6px 0;padding:5px 10px;font-size:12px;border-radius:6px;width:100%" onclick="showArticleEditor(null)">➕ 新增文章</button>`;
  cats.forEach(([cat, arts]) => {
    h += `<h3>📁 ${escHtml(cat)} (${arts.length})</h3>`;
    arts.forEach(a => {
      h += `<a class="link" onclick="openArticle('${escJs(a.path)}')">${escHtml(a.title)}</a>`;
    });
  });
  el.innerHTML = h;
}
function showAll() { selectedCategory = null; currentView = 'list'; renderSidebar(); renderList(); }
function performSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { showAll(); return; }
  const results = [];
  DATA.forEach(a => {
    let score = 0;
    if (a.title.toLowerCase().includes(q)) score += 10;
    if (a.summary.toLowerCase().includes(q)) score += 5;
    if (a.content.toLowerCase().includes(q)) score += 2;
    if (score > 0) {
      let snippet = '';
      const idx = a.content.toLowerCase().indexOf(q);
      if (idx >= 0) {
        const start = Math.max(0, idx - 50);
        const end = Math.min(a.content.length, idx + q.length + 50);
        snippet = (start > 0 ? '...' : '') + a.content.slice(start, end).replace(/\n/g, ' ') + (end < a.content.length ? '...' : '');
      }
      results.push({...a, score, snippet});
    }
  });
  results.sort((a,b) => b.score - a.score);
  const area = document.getElementById('viewArea');
  let h = '<div class="content">';
  h += `<div class="list-header">搜索 "${escHtml(q)}"，共 ${results.length} 条结果</div>`;
  results.forEach(r => {
    h += `<div class="card" onclick="openArticle('${escJs(r.path)}')">
      <div class="card-title">${escHtml(r.title)}</div>
      <div class="card-meta"><span>📅 ${r.date}</span><span>📂 ${r.category}</span><span>⭐ ${r.score}</span></div>
      <div class="card-summary">${escHtml(r.snippet || r.summary)}</div>
    </div>`;
  });
  h += '</div>';
  area.innerHTML = h;
}
function renderList() {
  const area = document.getElementById('viewArea');
  let arts = DATA;
  if (selectedCategory) arts = arts.filter(a => a.category === selectedCategory);
  if (arts.length === 0) { area.innerHTML = '<div class="content"><div class="empty"><div class="icon">📭</div><p>暂无文章</p></div></div>'; return; }
  let h = '<div class="content">';
  h += `<div class="list-header">共 <b>${arts.length}</b> 篇文章</div>`;
  arts.forEach(a => {
    h += `<div class="card" onclick="openArticle('${escJs(a.path)}')">
      <div class="card-title">${escHtml(a.title)}</div>
      <div class="card-meta"><span>📅 ${a.date}</span><span>📂 ${a.category}</span><span class="tag">${a.summary_method || 'auto'}</span><span>${a.word_count.toLocaleString()} 字</span></div>
      <div class="card-summary">${escHtml(a.summary || '暂无摘要')}</div>
    </div>`;
  });
  h += '</div>';
  area.innerHTML = h;
}
function openArticle(path) {
  const a = DATA.find(x => x.path === path);
  if (!a) return;
  currentView = 'detail';
  const area = document.getElementById('viewArea');
  let h = '<div class="article-detail">';
  h += `<button class="back-btn" onclick="goBack()">← 返回列表</button>`;
  h += `<h1>${escHtml(a.title)}</h1>`;
  h += `<div class="article-actions"><button class="btn-mini" onclick="var p=${escJs(a.path)};event.stopPropagation();showArticleEditor(DATA.find(a=>a.path===p))">✏️ 编辑</button><button class="btn-mini danger" onclick="var p=${escJs(a.path)};event.stopPropagation();deleteArticle(p)">🗑 删除</button></div>`;
  h += `<div class="article-meta"><span>📅 ${a.date}</span><span>📂 ${a.category}</span>${a.source && a.source.startsWith('http') ? `<span>🔗 <a href="${escHtml(a.source)}" target="_blank" style="color:var(--accent);text-decoration:none">${escHtml(a.source)}</a></span>` : `<span>🔗 ${escHtml(a.source)}</span>`}<span class="tag tag-green">${a.summary_method || 'auto'}</span></div>`;
  if (a.summary) h += `<div class="summary-block"><h3>📝 AI 摘要</h3><p>${escHtml(a.summary)}</p></div>`;
  h += `<div class="article-body">${renderMD(a.content)}</div>`;
  h += '</div>';
  area.innerHTML = h;
  window.scrollTo(0, 0);
}
function goBack() { currentView = 'list'; renderList(); window.scrollTo(0, 0); }
function escHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function escJs(t) { return t.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$'); }
function renderMD(text) {
  if (!text) return '';
  let h = text;
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  h = h.replace(/(https?:\/\/[^\s<>"{}|\^`\[\]]+)/g, '<a href="$1" target="_blank">$1</a>');
  h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  h = h.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/^---$/gm, '<hr>');
  h = h.replace(/^- (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  h = h.replace(/^\|(.+)\|$/gm, m => { const cells = m.split('|').filter(c => c.trim()); if (cells.every(c => c.trim().match(/^-+$/))) return ''; return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>'; });
  h = h.replace(/\n\n/g, '</p><p>');
  h = '<p>' + h + '</p>';
  return h;
}
init();
</script>
